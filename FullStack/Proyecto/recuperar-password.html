<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - S.I.G.S.M.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

  <div class="barra-accesibilidad">
    <div class="container d-flex justify-content-end gap-2">
      <button id="btnFuenteMenos" class="btn btn-outline-light btn-sm" aria-label="Disminuir tamaño de letra">A-</button>
      <button id="btnFuenteMas" class="btn btn-outline-light btn-sm" aria-label="Aumentar tamaño de letra">A+</button>
      <button id="btnContraste" class="btn btn-outline-light btn-sm" aria-pressed="false" aria-label="Alternar alto contraste">Alto contraste</button>
    </div>
  </div>

  <nav class="navbar navbar-dark navbar-sigsm">
    <div class="container">
      <span class="navbar-brand">S.I.G.S.M. - Hospital de Clínicas</span>
    </div>
  </nav>

  <main class="container">
    <div class="card shadow-sm tarjeta-central">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Recuperar contraseña</h1>
        <p class="text-muted">Ingresá tu usuario o correo y te enviaremos instrucciones para restablecer tu contraseña.</p>

        <!-- action apuntará al script PHP que genera el enlace de recuperación -->
        <form action="#" method="post">
          <div class="mb-3">
            <label for="usuarioRecuperar" class="form-label">Usuario o correo electrónico</label>
            <input type="text" class="form-control form-control-lg" id="usuarioRecuperar" name="usuario" required autofocus>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg-accesible">Enviar instrucciones</button>
          </div>
        </form>

        <p class="text-center mt-3 mb-0">
          <a href="login.html">&larr; Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="pie-sigsm text-center">
    Sistema Informático de Gestión de Servicios Médicos - Hospital de Clínicas
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/accesibilidad.js"></script>
</body>
</html>
