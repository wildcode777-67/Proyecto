  <main class="container my-4">
    <a href="panel-admin.html" class="btn btn-link ps-0 mb-2">&larr; Volver al listado</a>

    <div class="card shadow-sm" style="max-width: 640px;">
      <div class="card-body p-4">
        <!--
          Esta misma pantalla sirve para Alta y para Edición:
          - Alta: el formulario llega vacío.
          - Edición: en PHP, los campos se precargan con los datos del
            documento (value="<?php echo $documento['titulo']; ?>", etc.)
            y se agrega un input hidden con el id del documento.
        -->
        <h1 class="h4 mb-4">Nuevo documento</h1>

        <form action="#" method="post">

          <!-- En edición: <input type="hidden" name="id" value="1"> -->

          <div class="mb-3">
            <label for="titulo" class="form-label">Título del documento</label>
            <input type="text" class="form-control form-control-lg" id="titulo" name="titulo" required>
          </div>

          <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select form-select-lg" id="categoria" name="categoria" required>
              <option value="" selected disabled>Seleccione una categoría</option>
              <option value="nefrologia">Nefrología</option>
              <option value="cardiologia">Cardiología</option>
              <option value="trasplantes">Trasplantes</option>
              <option value="imagenologia">Estudios imagenológicos</option>
              <option value="ostomia">Pacientes ostomizados</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="contenido" class="form-label">Contenido / indicaciones</label>
            <textarea class="form-control" id="contenido" name="contenido" rows="6" required></textarea>
          </div>

          <div class="mb-4">
            <label for="archivo" class="form-label">Adjuntar archivo (opcional)</label>
            <input type="file" class="form-control" id="archivo" name="archivo">
            <div class="form-text">PDF o imagen. Si no se adjunta, se usa solo el texto de arriba.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg-accesible">Guardar documento</button>
            <a href="panel-admin.html" class="btn btn-outline-secondary btn-lg-accesible">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
