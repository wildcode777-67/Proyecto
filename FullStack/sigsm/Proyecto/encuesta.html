<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de satisfacción - S.I.G.S.M.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

  <div class="barra-accesibilidad">
    <div class="container d-flex justify-content-end gap-2">
      <button id="btnFuenteMenos" class="btn btn-outline-light btn-sm" aria-label="Disminuir tamaño de letra">A-</button>
      <button id="btnFuenteMas" class="btn btn-outline-light btn-sm" aria-label="Aumentar tamaño de letra">A+</button>
      <button id="btnContraste" class="btn btn-outline-light btn-sm" aria-pressed="false" aria-label="Alternar alto contraste">Alto contraste</button>
    </div>
  </div>

  <nav class="navbar navbar-dark navbar-sigsm">
    <div class="container">
      <span class="navbar-brand">Hospital de Clínicas</span>
    </div>
  </nav>

  <main class="container my-4">
    <div class="card shadow-sm tarjeta-central" style="max-width: 560px;">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Encuesta de satisfacción</h1>
        <p class="text-muted">Sus respuestas son anónimas y nos ayudan a mejorar el servicio.</p>

        <!-- action apuntará al script PHP que guarda la respuesta en la base -->
        <form id="formEncuesta" action="#" method="post" onsubmit="return validarEncuesta()">

          <div class="mb-4">
            <label for="calificacion" class="form-label">¿Cómo calificaría la atención recibida?</label>
            <select class="form-select form-select-lg" id="calificacion" name="calificacion">
              <option value="" selected disabled>Seleccione una opción</option>
              <option value="5">Excelente</option>
              <option value="4">Muy buena</option>
              <option value="3">Buena</option>
              <option value="2">Regular</option>
              <option value="1">Mala</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label">¿La información recibida fue clara?</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="claridad" id="claridadSi" value="si">
              <label class="form-check-label" for="claridadSi">Sí</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="claridad" id="claridadNo" value="no">
              <label class="form-check-label" for="claridadNo">No</label>
            </div>
          </div>

          <div class="mb-4">
            <label for="comentario" class="form-label">Comentarios (opcional)</label>
            <textarea class="form-control" id="comentario" name="comentario" rows="3"></textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg-accesible">Enviar encuesta</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="pie-sigsm text-center">
    Sistema Informático de Gestión de Servicios Médicos - Hospital de Clínicas
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/accesibilidad.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
