<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - S.I.G.S.M.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body class="login-page">

    <!-- Accesibilidad: se conserva el funcionamiento original -->
    <div class="barra-accesibilidad">
        <div class="container d-flex justify-content-end gap-2">
            <button id="btnFuenteMenos" class="btn btn-outline-light btn-sm" type="button">A-</button>
            <button id="btnFuenteMas" class="btn btn-outline-light btn-sm" type="button">A+</button>
            <button id="btnContraste" class="btn btn-outline-light btn-sm" type="button">Alto contraste</button>
        </div>
    </div>

    <main class="login-wrapper">
        <!-- Lado izquierdo: imagen y descripción (58 %) -->
        <section class="login-left" aria-label="Presentación del sistema">
            <div class="login-overlay">
                <div class="login-brand">
                    <h1>S.I.G.S.M.</h1>
                    <h3 class="mb-3">Sistema Informático de Gestión de Servicios Médicos</h3>
                    <p class="mb-0">Acceso a la documentación informativa para pacientes y personal del Hospital de Clínicas.</p>
                </div>
            </div>
        </section>

        <!-- Lado derecho: formulario de inicio de sesión (42 %) -->
        <section class="login-right" aria-label="Inicio de sesión">
            <div class="login-box">
                <div class="login-logo" aria-hidden="true">+</div>
                <h2 class="h3 text-center fw-bold mb-1">Hospital De Clinicas</h2>
                <p class="text-muted text-center mb-4">Ingreso del personal autorizado</p>

                <!-- Se mantienen los mismos IDs, nombres y función JS -->
                <form id="formLogin" onsubmit="iniciarSesion(event); return false;">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="usuario" name="usuario"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg-accesible mt-2">Ingresar</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
                </p>
            </div>
            <footer class="login-footer">
                S.I.G.S.M. · Hospital de Clínicas
            </footer>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/accesibilidad.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
