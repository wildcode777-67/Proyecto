<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - S.I.G.S.M.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

  <!-- Barra de accesibilidad: RNF-05 (tamaño de fuente), RNF-06 (contraste) -->
  <div class="barra-accesibilidad">
    <div class="container d-flex justify-content-end gap-2">
      <button id="btnFuenteMenos" class="btn btn-outline-light btn-sm" aria-label="Disminuir tamaño de letra">A-</button>
      <button id="btnFuenteMas" class="btn btn-outline-light btn-sm" aria-label="Aumentar tamaño de letra">A+</button>
      <button id="btnContraste" class="btn btn-outline-light btn-sm" aria-pressed="false" aria-label="Alternar alto contraste">Alto contraste</button>
    </div>
  </div>

  <nav class="navbar navbar-dark navbar-sigsm">
    <div class="container">
      <span class="navbar-brand">S.I.G.S.M. - Hospital de Clínicas</span>
    </div>
  </nav>

  <main class="container">
    <div class="card shadow-sm tarjeta-central">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-4">Iniciar sesión</h1>

        <!-- El action apuntará al script PHP que procesa el login (ej: procesar_login.php) -->
        <form id="formLogin" action="#" method="post" onsubmit="return validarLogin()">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario o cédula</label>
            <input type="text" class="form-control form-control-lg" id="usuario" name="usuario" autofocus>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password">
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg-accesible">Ingresar</button>
          </div>
        </form>

        <p class="text-center mt-3 mb-1">
          <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="text-center text-muted mb-0">
          <small>Por seguridad, la cuenta se suspende luego de 5 intentos fallidos.</small>
        </p>
      </div>
    </div>
  </main>

  <footer class="pie-sigsm text-center">
    Sistema Informático de Gestión de Servicios Médicos - Hospital de Clínicas
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/accesibilidad.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
